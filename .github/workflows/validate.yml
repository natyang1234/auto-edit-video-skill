name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg and CJK font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install pinned fontTools (matches the local python3.14 runtime)
        run: python3 -m pip install --break-system-packages fonttools==4.62.1
      - name: Validate package
        run: python3 scripts/validate_skill.py
      - name: Run unit tests
        run: python3 -m unittest discover -s skills/auto-edit-video/tests -p 'test_*.py'
      - name: Test universal installer
        run: bash tests/test_install.sh
